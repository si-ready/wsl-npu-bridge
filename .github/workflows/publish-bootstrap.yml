name: publish-bootstrap

# ONE-TIME bootstrap for crates.io. A Trusted Publisher can only
# be registered on a crate that already exists, so the first
# version must go out with an API token. This workflow reads the
# token from the repo secret CARGO_REGISTRY_TOKEN (Settings ->
# Secrets and variables -> Actions), publishes once, and is then
# deleted along with the secret; the token gets revoked on
# crates.io the same day. Every later publish uses
# publish-crate.yml (OIDC Trusted Publishing, no stored key).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: publish the first version with the bootstrap token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (the build gate)
        working-directory: bridgekeeper
        run: cargo test --release
      - name: Publish (bootstrap token)
        working-directory: bridgekeeper
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
